<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <link rel="stylesheet" href="under_cons.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Our Website is Under Construction!</h1>
            <p>We're working hard to bring you a better experience.</p>
        </header>
        
        <div class="game-container">
            <h2>In the meantime, enjoy a quick game!</h2>
            <div id="game">
                <div class="choices">
                    <button class="choice" onclick="play('rock')">Rock</button>
                    <button class="choice" onclick="play('paper')">Paper</button>
                    <button class="choice" onclick="play('scissors')">Scissors</button>
                </div>
                <div id="result"></div>
            </div>
        </div>
    </div>

    <script src="under_cons.js"></script>
</body>
</html>
